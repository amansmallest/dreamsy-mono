name: Idea or feature
description: A new kit, editor feature, engine capability or anything else
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Dreamsy to do, and what game would it help make?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Examples from other games, sketches, links.
