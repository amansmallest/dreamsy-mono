project:
    id: cbd61c9f-9864-44de-85a1-b1b7e5c78917
session:
    idle_timeout_seconds: 1800
build:
    framework: expo
    profiles:
        development:
            ios:
                app_id: 49424604-97e2-4275-878e-641432457855
                setup_commands:
                    - cd ../.. && pnpm install
                    - if [ ! -d ios ]; then npx expo prebuild --platform ios --no-install; fi
                    - 'perl -pi -e ''s/compiler\(>=6\.4\)/canImport(SwiftUICore, _version: 8.0.85)/'' node_modules/expo-dev-launcher/ios/SwiftUI/Navigation/DevLauncherToolbar.swift'
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
                output_path: ios/build/Build/Products/Debug-iphonesimulator/*.app
            android:
                setup_commands:
                    - cd ../.. && pnpm install
                    - if [ ! -d android ]; then npx expo prebuild --platform android --no-install; fi
                build_commands:
                    - cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
                output_path: android/app/build/outputs/apk/debug/app-debug.apk
        preview:
            ios:
                app_id: 49424604-97e2-4275-878e-641432457855
                setup_commands:
                    - cd ../.. && pnpm install
                    - if [ ! -d ios ]; then npx expo prebuild --platform ios --no-install; fi
                    - 'perl -pi -e ''s/compiler\(>=6\.4\)/canImport(SwiftUICore, _version: 8.0.85)/'' node_modules/expo-dev-launcher/ios/SwiftUI/Navigation/DevLauncherToolbar.swift'
                build_commands:
                    - cd ios && if [ ! -d Pods ]; then pod install; fi && WS=$(ls -d *.xcworkspace | head -n 1) && xcodebuild -workspace "$WS" -scheme "${WS%.xcworkspace}" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
                output_path: ios/build/Build/Products/Release-iphonesimulator/*.app
            android:
                setup_commands:
                    - cd ../.. && pnpm install
                    - if [ ! -d android ]; then npx expo prebuild --platform android --no-install; fi
                build_commands:
                    - cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
                output_path: android/app/build/outputs/apk/release/app-release.apk
