app = "dreamsy-dev"
primary_region = "sin"

[build]
  dockerfile = "deploy/fly/Dockerfile"
  ignorefile = "deploy/fly/Dockerfile.dockerignore"

[env]
  NODE_ENV = "production"
  SITE_URL = "https://dreamsy.dev"

[[mounts]]
  source = "dreamsy_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: ChatGPT gives up during a ~7 s cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
