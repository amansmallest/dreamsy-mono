format = "0"
name = "Feature Demo"
description = "Portrait pixel demo of engine v3: sprite animation, tweens, particles, camera, save data, dialogs, collision layers, text styles."
dimension = "2d"
orientation = "portrait"
entry_scene = "scenes/main.scene.json"

[players]
min = 1
max = 1

[server]
mode = "none"

[physics]
layers = ["player", "enemy", "pickup", "world"]

[style]
preset = "pixel"
grid = 16
palette = ["#1a1c2c", "#5d275d", "#b13e53", "#ef7d57", "#ffcd75", "#a7f070", "#38b764", "#257179", "#29366f", "#3b5dc9", "#41a6f6", "#73eff7", "#f4f4f4", "#94b0c2", "#566c86", "#333c57"]

[ui]
primary = "#3b5dc9"
accent = "#ffcd75"
background = "#1a1c2c"
text = "#f4f4f4"
panel = "pixel"
font = "pixel"
