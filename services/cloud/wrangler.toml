name = "dreamsy-cloud"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:3100,http://localhost:3100"
MAX_PACK_BYTES = "8000000"

[[r2_buckets]]
binding = "GAMES"
bucket_name = "dreamsy-games"

[[d1_databases]]
binding = "DB"
database_name = "dreamsy"
database_id = "0aeda62a-fef8-435a-ba90-16294ca69f15"
migrations_dir = "migrations"
